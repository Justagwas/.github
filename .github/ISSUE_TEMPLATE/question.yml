name: Question
description: Ask about documented usage, configuration, or project behavior.
title: "[Question]: "
labels: []
assignees:
  - Justagwas
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What would you like clarified?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include the project version, environment, relevant settings, and what you have already tried.
    validations:
      required: false
