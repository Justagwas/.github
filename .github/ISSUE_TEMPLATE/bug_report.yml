name: Bug report
description: Report reproducible behavior that does not work as documented.
title: "[Bug]: "
labels: []
assignees:
  - Justagwas
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Search existing issues first and remove private information from anything you attach.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that demonstrates the problem.
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the project version or commit and any relevant operating system, device, runtime, service, or configuration.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or supporting material
      description: Add relevant logs, screenshots, or minimal examples after removing private information.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed credentials, personal information, and other private data.
          required: true
